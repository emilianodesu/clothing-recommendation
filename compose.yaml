x-build-secrets: &build-secrets
  - build_ca

x-job-environment: &job-environment
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  POSTGRES_HOST: postgres
  HM_APP_PASSWORD: ${HM_APP_PASSWORD:?Run bootstrap first}
  HM_AIRFLOW_PASSWORD: ${HM_AIRFLOW_PASSWORD:?Run bootstrap first}
  HM_MLFLOW_PASSWORD: ${HM_MLFLOW_PASSWORD:?Run bootstrap first}
  QDRANT_URL: http://qdrant:6333
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  POLARS_MAX_THREADS: "2"
  PYTEST_ADDOPTS: "-o cache_dir=/tmp/pytest-cache"

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap first}
      HM_APP_PASSWORD: ${HM_APP_PASSWORD:?Run bootstrap first}
      HM_AIRFLOW_PASSWORD: ${HM_AIRFLOW_PASSWORD:?Run bootstrap first}
      HM_MLFLOW_PASSWORD: ${HM_MLFLOW_PASSWORD:?Run bootstrap first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./docker/postgres/init-db.sh
        target: /docker-entrypoint-initdb.d/10-databases.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped
    networks: [backend]

  qdrant:
    profiles: [experimental]
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; IFS= read -r line <&3; [[ $$line == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped
    networks: [backend]

  mlflow:
    image: hmrec-jobs:0.1.0
    profiles: [training]
    user: "0:0"
    command: [python, -m, hm_recommender.model.tracking]
    environment:
      HM_MLFLOW_PASSWORD: ${HM_MLFLOW_PASSWORD:?Run bootstrap first}
      PYTHONDONTWRITEBYTECODE: "1"
      MLFLOW_DISABLE_TELEMETRY: "true"
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_SERVER_JOB_ENABLE_PERIODIC_TASKS: "false"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - mlflow_artifacts:/mlartifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 40
    mem_limit: 1g
    cpus: 1
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    networks: [backend]

  app-check:
    image: hmrec-app:0.1.0
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      secrets: *build-secrets
    profiles: [tools]
    user: ${HMREC_UID:?Run bootstrap first}:${HMREC_GID:?Run bootstrap first}
    command: [hmrec, check, --imports-only]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    read_only: true
    tmpfs: [/tmp]
    networks: [backend]

  api:
    image: hmrec-app:0.1.0
    profiles: [serve]
    user: ${HMREC_UID:?Run bootstrap first}:${HMREC_GID:?Run bootstrap first}
    command: [hmrec, serving, run]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      POSTGRES_HOST: postgres
      HM_APP_PASSWORD: ${HM_APP_PASSWORD:?Run bootstrap first}
      HMREC_SERVING_DIR: /serving
      HMREC_INPUT_ROOT: /artifacts
      HMREC_IMAGE_ARCHIVE: /data/kaggle_hm/h-and-m-personalized-fashion-recommendations.zip
      HMREC_IMAGE_CACHE_BYTES: ${HMREC_IMAGE_CACHE_BYTES:-67108864}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      POLARS_MAX_THREADS: "2"
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARTIFACTS_DIR:-./artifacts}
        target: /artifacts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARTIFACTS_DIR:-./artifacts}/serving
        target: /serving
        bind:
          create_host_path: false
      - type: bind
        source: ./.runtime/server
        target: /etc/hmrec/server
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 60s
    mem_limit: 4g
    cpus: 2
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    networks: [backend, api-publication]

  ui:
    image: hmrec-app:0.1.0
    profiles: [serve, demo]
    user: ${HMREC_UID:?Run bootstrap first}:${HMREC_GID:?Run bootstrap first}
    command: [streamlit, run, /opt/hmrec/src/hm_recommender/ui/app.py, --server.address=0.0.0.0, --server.port=8501, --server.headless=true, --browser.gatherUsageStats=false, --server.enableCORS=false, --server.enableXsrfProtection=false]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      STREAMLIT_SERVER_ENABLE_CORS: "false"
      STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "false"
      HMREC_API_URL: http://api:8000
      HM_APP_PASSWORD: ${HM_APP_PASSWORD:?Run bootstrap first}
    ports:
      - "127.0.0.1:${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    networks: [api-publication]

  serving-probe:
    image: hmrec-jobs:0.1.0
    profiles: [tools]
    user: ${HMREC_UID:?Run bootstrap first}:${HMREC_GID:?Run bootstrap first}
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      POLARS_MAX_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - type: bind
        source: ${ARTIFACTS_DIR:-./artifacts}
        target: /artifacts
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 3g
    cpus: 1
    networks: [backend]

  events-job:
    extends:
      service: jobs
    mem_limit: 3g
    cpus: 1
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ARTIFACTS_DIR:-./artifacts}
        target: /artifacts
        read_only: true
        bind:
          create_host_path: false

  jobs:
    image: hmrec-jobs:0.1.0
    build:
      context: .
      dockerfile: docker/jobs.Dockerfile
      secrets: *build-secrets
    profiles: [tools]
    user: ${HMREC_UID:?Run bootstrap first}:${HMREC_GID:?Run bootstrap first}
    command: [hmrec, check]
    environment: *job-environment
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${ARTIFACTS_DIR:-./artifacts}
        target: /artifacts
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 5g
    cpus: 3
    networks: [backend]

  airflow-scheduler:
    image: hmrec-airflow:0.1.0
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
      secrets: *build-secrets
    profiles: [pipeline]
    user: ${HMREC_UID:?Run bootstrap first}:${HMREC_GID:?Run bootstrap first}
    command: [scheduler]
    environment: &airflow-environment
      <<: *job-environment
      AIRFLOW_HOME: /opt/airflow/state
      HOME: /opt/airflow/state
      USER: hmrec
      LOGNAME: hmrec
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
      AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "false"
      AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/state/logs
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__API__SECRET_KEY: ${HM_AIRFLOW_PASSWORD:?Run bootstrap first}
      HMREC_SOURCE_COMMIT: ${HMREC_SOURCE_COMMIT:-unset}
      HMREC_API_URL: http://api:8000
    volumes: &airflow-volumes
      - ${ARTIFACTS_DIR:-./artifacts}/airflow:/opt/airflow/state
      - ${ARTIFACTS_DIR:-./artifacts}:/artifacts
      - ${DATA_DIR:-./data}:/data
    mem_limit: 5g
    cpus: 2
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test: [CMD, /opt/airflow-env/bin/python, /opt/airflow/entrypoint.py, jobs, check, --job-type, SchedulerJob, --local]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  airflow-api:
    extends:
      service: airflow-scheduler
    command: [api-server]
    mem_limit: 768m
    cpus: 0.5
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    networks: [backend, api-publication]
    healthcheck:
      test: [CMD, /opt/airflow-env/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  airflow-dag-processor:
    extends:
      service: airflow-scheduler
    command: [dag-processor]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD, /opt/airflow-env/bin/python, /opt/airflow/entrypoint.py, jobs, check, --job-type, DagProcessorJob, --local]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  backend:
    internal: true
  api-publication:

volumes:
  postgres_data:
  qdrant_data:
  mlflow_artifacts:

secrets:
  build_ca:
    file: ./.runtime/build-ca.pem
