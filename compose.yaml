x-build-secrets: &build-secrets
  - build_ca

x-job-environment: &job-environment
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  POSTGRES_HOST: postgres
  HM_APP_PASSWORD: ${HM_APP_PASSWORD:?Run bootstrap first}
  HM_AIRFLOW_PASSWORD: ${HM_AIRFLOW_PASSWORD:?Run bootstrap first}
  HM_MLFLOW_PASSWORD: ${HM_MLFLOW_PASSWORD:?Run bootstrap first}
  QDRANT_URL: http://qdrant:6333
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  POLARS_MAX_THREADS: "2"
  PYTEST_ADDOPTS: "-o cache_dir=/tmp/pytest-cache"

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap first}
      HM_APP_PASSWORD: ${HM_APP_PASSWORD:?Run bootstrap first}
      HM_AIRFLOW_PASSWORD: ${HM_AIRFLOW_PASSWORD:?Run bootstrap first}
      HM_MLFLOW_PASSWORD: ${HM_MLFLOW_PASSWORD:?Run bootstrap first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./docker/postgres/init-db.sh
        target: /docker-entrypoint-initdb.d/10-databases.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped
    networks: [backend]

  qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; IFS= read -r line <&3; [[ $$line == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped
    networks: [backend]

  app-check:
    image: hmrec-app:0.1.0
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      secrets: *build-secrets
    profiles: [tools]
    user: ${HMREC_UID:?Run bootstrap first}:${HMREC_GID:?Run bootstrap first}
    command: [hmrec, check, --imports-only]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    read_only: true
    tmpfs: [/tmp]
    networks: [backend]

  jobs:
    image: hmrec-jobs:0.1.0
    build:
      context: .
      dockerfile: docker/jobs.Dockerfile
      secrets: *build-secrets
    profiles: [tools]
    user: ${HMREC_UID:?Run bootstrap first}:${HMREC_GID:?Run bootstrap first}
    command: [hmrec, check]
    environment: *job-environment
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${ARTIFACTS_DIR:-./artifacts}
        target: /artifacts
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 5g
    cpus: 3
    networks: [backend]

networks:
  backend:
    internal: true

volumes:
  postgres_data:
  qdrant_data:

secrets:
  build_ca:
    file: ./.runtime/build-ca.pem
